    <script>
      // Set theme before first paint to avoid flashing. Dark is the default;
      // only a stored explicit choice switches to light.
      ;(function () {
        try {
          var theme = localStorage.getItem('avleen-theme') === 'light' ? 'light' : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
